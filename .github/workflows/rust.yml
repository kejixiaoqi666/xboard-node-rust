name: Rust experimental runtime

on:
  push:
    branches: [main, 'codex/rust-*']
    paths: ['crates/**', 'vendor/**', 'Cargo.*', 'rust-toolchain.toml', '.github/workflows/rust.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    timeout-minutes: 60
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt -- --check
      - run: cargo test --workspace --locked -j 2 -- --test-threads=1
      - run: cargo clippy --workspace --all-targets --all-features --locked -j 2 -- -D warnings
      - run: cargo build -p node-runtime --release --locked -j 2
