name: Build Linux release

on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['crates/**', 'vendor/**', 'Cargo.*', 'rust-toolchain.toml', 'install.sh', 'scripts/**', 'LICENSE', 'NOTICE.md', '.github/workflows/release.yml']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (for example v0.1.0-preview.12)'
        required: true
        default: v0.1.0-preview.12
      source_ref:
        description: 'Exact Git source ref; blank uses the dispatched commit'
        required: false
      publish_draft:
        description: 'Create a draft release after validation'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            arch: amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Verify exact source and release identity
        env:
          SOURCE_REF: ${{ inputs.source_ref || github.sha }}
          RELEASE_VERSION: ${{ inputs.version || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v0.1.0-preview.12' }}
          PUBLISH_DRAFT: ${{ inputs.publish_draft || false }}
        run: |
          set -euo pipefail
          source_commit=$(git rev-parse HEAD)
          requested_commit=$(git rev-parse "${SOURCE_REF}^{commit}")
          test "$source_commit" = "$requested_commit"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            test "$GITHUB_REF_NAME" = "$RELEASE_VERSION"
            tag_commit=$(git ls-remote origin "refs/tags/${RELEASE_VERSION}^{}" | awk '{print $1}')
            test "$tag_commit" = "$source_commit"
          elif [[ "$PUBLISH_DRAFT" == "true" ]]; then
            tag_commit=$(git ls-remote origin "refs/tags/${RELEASE_VERSION}^{}" | awk '{print $1}')
            test "$tag_commit" = "$source_commit"
          fi
      - name: Install build tools and pinned Rust
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools python3 python3-cryptography binutils shellcheck
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --component rust-docs
          rustup target add ${{ matrix.target }} --toolchain 1.98.1
      - name: Rust and installer checks
        run: |
          cargo fmt -- --check
          cargo test --workspace --locked -j 2 -- --test-threads=1
          cargo clippy --workspace --all-targets --all-features --locked -j 2 -- -D warnings
          bash -n install.sh
          shellcheck install.sh
      - name: Build static runtime
        run: cargo build -p node-runtime --target ${{ matrix.target }} --release --locked -j 2
      - name: Pin official compatibility clients
        run: |
          python3 crates/node-extended/tests/fetch_clients.py --client xray --platform linux-${{ matrix.arch }} --output "$RUNNER_TEMP/xbr-clients/xray"
          python3 crates/node-extended/tests/fetch_clients.py --client sing-box --platform linux-${{ matrix.arch }} --output "$RUNNER_TEMP/xbr-clients/sing-box"
          echo "XRAY_TEST_BINARY=$RUNNER_TEMP/xbr-clients/xray" >> "$GITHUB_ENV"
          echo "XRAY_TEST_CLIENT=$RUNNER_TEMP/xbr-clients/xray" >> "$GITHUB_ENV"
          echo "SING_BOX_TEST_CLIENT=$RUNNER_TEMP/xbr-clients/sing-box" >> "$GITHUB_ENV"
          echo "SING_BOX_BIN=$RUNNER_TEMP/xbr-clients/sing-box" >> "$GITHUB_ENV"
      - name: Official client and native plugin interoperability
        run: |
          mkdir -p dist
          set -o pipefail
          cargo test -p node-extended --test official_clients --locked -j 2 -- --ignored --nocapture 2>&1 | tee dist/official-extended-${{ matrix.arch }}.log
          cargo test -p node-quic --test loopback --locked -j 2 -- --ignored --nocapture 2>&1 | tee dist/official-quic-${{ matrix.arch }}.log
          cargo test -p node-outbound --test proxy_wire --locked -j 2 -- --ignored --nocapture 2>&1 | tee dist/official-outbound-${{ matrix.arch }}.log
          cargo test -p node-native --lib --locked -j 2 all_eighteen_methods_official -- --ignored --nocapture 2>&1 | tee dist/official-shadowsocks-${{ matrix.arch }}.log
          cargo test -p node-native --test native_plugin_transport --locked -j 2 -- --ignored --nocapture 2>&1 | tee dist/official-plugin-${{ matrix.arch }}.log
      - name: Production embedded fleet and payload accounting
        run: |
          python3 scripts/test_native_protocols.py --binary target/${{ matrix.target }}/release/xboard-node-rust --sing-box "$SING_BOX_TEST_CLIENT" --output dist/native-protocol-tests-${{ matrix.arch }}.json
      - name: Package and verify installer lifecycle
        env:
          RELEASE_VERSION: ${{ inputs.version || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v0.1.0-preview.12' }}
        run: |
          python3 scripts/package_release.py --target ${{ matrix.target }} --version "$RELEASE_VERSION" --binary target/${{ matrix.target }}/release/xboard-node-rust
          sudo python3 scripts/test_installer.py --binary target/${{ matrix.target }}/release/xboard-node-rust --package dist/xboard-node-rust-linux-${{ matrix.arch }}.tar.gz --checksums dist/SHA256SUMS --output dist/installer-tests-${{ matrix.arch }}.json
          PREVIOUS_DIR=$(mktemp -d "$RUNNER_TEMP/xbr-previous.XXXXXXXX")
          curl -fsSL --retry 3 "https://github.com/kejixiaoqi666/xboard-node-rust/releases/download/v0.1.0-preview.1/xboard-node-rust-linux-${{ matrix.arch }}.tar.gz" -o "$PREVIOUS_DIR/xboard-node-rust-linux-${{ matrix.arch }}.tar.gz"
          curl -fsSL --retry 3 "https://github.com/kejixiaoqi666/xboard-node-rust/releases/download/v0.1.0-preview.1/SHA256SUMS" -o "$PREVIOUS_DIR/SHA256SUMS"
          sudo --preserve-env=XRAY_TEST_BINARY python3 scripts/test_systemd.py --binary target/${{ matrix.target }}/release/xboard-node-rust --package dist/xboard-node-rust-linux-${{ matrix.arch }}.tar.gz --checksums dist/SHA256SUMS --previous-package "$PREVIOUS_DIR/xboard-node-rust-linux-${{ matrix.arch }}.tar.gz" --previous-checksums "$PREVIOUS_DIR/SHA256SUMS" --output dist/systemd-tests-${{ matrix.arch }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  draft:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_draft)
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Verify draft source and tag identity
        env:
          SOURCE_REF: ${{ inputs.source_ref || github.sha }}
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          source_commit=$(git rev-parse HEAD)
          requested_commit=$(git rev-parse "${SOURCE_REF}^{commit}")
          test "$source_commit" = "$requested_commit"
          tag_commit=$(git ls-remote origin "refs/tags/${RELEASE_VERSION}^{}" | awk '{print $1}')
          test "$tag_commit" = "$source_commit"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Combine checksums and prepare draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          python3 scripts/prepare_release_assets.py artifacts dist
          gh release create "$RELEASE_VERSION" --draft --prerelease --verify-tag --title "Xboard Node Rust $RELEASE_VERSION" --notes-file RELEASE_NOTES.md
          gh release upload "$RELEASE_VERSION" dist/*
