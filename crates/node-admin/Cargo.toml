[package]
name = "node-admin"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"

[dependencies]
node-core = { path = "../node-core" }
async-trait = "0.1"
fs2 = "0.4"
http = "1"
hickory-resolver = { version = "0.26.3", default-features = false, features = ["tokio", "system-config"] }
instant-acme = { version = "0.8.5", default-features = false, features = ["hyper-rustls", "ring"] }
libc = "0.2"
rcgen = { version = "0.14.10", default-features = false, features = ["pem", "ring", "crypto"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "net", "io-util", "process"] }
x509-parser = "0.18"
zeroize = { version = "1", features = ["derive"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }
