[package]
name = "node-quic"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"

[dependencies]
node-session = { path = "../node-session" }
bytes = "1"
http = "1"
h3 = "0.0.8"
h3-quinn = "0.0.10"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
blake2 = "0.10"
rand = "0.8"
subtle = "2"
tracing = "0.1"

[dev-dependencies]
async-trait = "0.1"
rcgen = { version = "0.13", default-features = false, features = ["ring", "crypto"] }
