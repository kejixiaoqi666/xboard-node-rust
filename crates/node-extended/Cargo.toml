[package]
name = "node-extended"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0 AND MIT"
description = "Native VMess AEAD, AnyTLS v2 and bounded multiplexed transports"

[dependencies]
node-session = { path = "../node-session" }
async-trait = "0.1"
aes = "0.8"
ring = "0.17"
base64 = "0.22"
bytes = "1"
digest = "0.11"
futures = "0.3"
h2 = "0.4"
http = "1"
log = "0.4"
md-5 = "0.11"
rand = "0.10"
shake = "0.1"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec", "io", "rt"] }
tokio-tungstenite = "0.28"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
