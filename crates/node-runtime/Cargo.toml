[package]
name = "node-runtime"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"

[[bin]]
name = "xboard-node-rust"
path = "src/main.rs"

[dependencies]
node-core = { path = "../node-core" }
node-panel = { path = "../node-panel" }
node-kernel = { path = "../node-kernel" }
node-native = { path = "../node-native" }
node-admin = { path = "../node-admin" }
async-trait = "0.1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "io-util"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util"] }

[[bench]]
name = "cached_poll"
harness = false
